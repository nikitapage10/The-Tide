name: Publish lore
on:
  push:
    paths:
      - 'fixtures/publication/lore-release.json'
      - 'scripts/publish-bundle.ts'
      - 'scripts/postgres-publication-store.ts'
      - '.github/workflows/publish-lore.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tide-lore-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TIDE_SKIP_UNCHANGED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Verify the publisher against a throwaway database
        run: npm run test:db
      - name: Validate and publish the approved lore
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo '::error::The existing SUPABASE_DB_URL repository secret is required.'
            exit 1
          fi
          npm run publish:bundle -- fixtures/publication/lore-release.json
