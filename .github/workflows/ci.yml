# Checks every push and pull request: lint, types, unit/route tests, SQL/RLS tests
# on a throwaway Postgres, production build, browser-bundle secret scan and
# end-to-end tests (Playwright + axe) in local demo mode. Uses no secrets.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: SQL / RLS tests
        run: npm run test:db
      - name: Build (with sentinel secrets for the bundle scan)
        run: npm run build
        env:
          SUPABASE_SECRET_KEY: tide-sentinel-secret-key
          SUPABASE_SERVICE_ROLE_KEY: tide-sentinel-service-role
          TIDE_PUBLISHER_TOKEN_SHA256: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
      - run: npm run check:bundle-secrets
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
