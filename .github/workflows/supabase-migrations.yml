# Applies supabase/migrations/*.sql (and the idempotent supabase/seed.sql) to the
# hosted Supabase database. Runs on pushes to the default branch that touch
# supabase/, or manually from the Actions tab. Already-applied migrations are
# skipped, so re-running is safe.
#
# Required repository secret (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL  Supabase dashboard → Connect → "Session pooler" connection
#                    string, with your database password filled in. (GitHub runners
#                    have no IPv6, so use the pooler string, not "Direct connection".)
# Optional: the GM email, via the "gm_email" input when run by hand, or the
#   TIDE_GM_EMAIL secret. It is stored as an invite; that person becomes GM on
#   first sign-in (or immediately if they already have an account).
name: Supabase migrations

on:
  push:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:
    inputs:
      gm_email:
        description: "Email to make GM (applied now if that user exists, otherwise on their first sign-in)"
        required: false
        type: string

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    # Only the default branch touches the real database; other branches never do.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      TIDE_GM_EMAIL: ${{ inputs.gm_email || secrets.TIDE_GM_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        id: config
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL secret is not set; skipping. See the comment at the top of this workflow."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif echo "$SUPABASE_DB_URL" | grep -Eq '@db\.[a-z0-9]+\.supabase\.co'; then
            echo "::error::SUPABASE_DB_URL is the 'Direct connection' string (IPv6 only), which GitHub runners cannot reach. In Supabase click Connect, choose 'Session pooler', copy that URI (host ends in pooler.supabase.com), fill in your password and update the secret."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.config.outputs.ready == 'true'
        with:
          version: latest

      - name: Preview pending migrations
        if: steps.config.outputs.ready == 'true'
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-seed --dry-run --yes

      - name: Apply migrations and seed
        if: steps.config.outputs.ready == 'true'
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-seed --yes

      - name: Invite GM (optional)
        if: steps.config.outputs.ready == 'true' && env.TIDE_GM_EMAIL != ''
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -v email="$TIDE_GM_EMAIL" -q <<'SQL'
          insert into public.project_invites (project_id, email)
          values ('333ea628-f6a1-4f3a-8b83-ce98d12f2565', lower(trim(:'email')))
          on conflict do nothing;
          insert into public.project_members (project_id, user_id, role)
          select '333ea628-f6a1-4f3a-8b83-ce98d12f2565', u.id, 'gm'
          from auth.users u where lower(u.email) = lower(trim(:'email'))
          on conflict (project_id, user_id) do nothing;
          select case
            when exists (select 1 from auth.users where lower(email) = lower(trim(:'email'))) then 'GM access is in place.'
            else 'Invite stored: this email becomes GM on its first sign-in.'
          end as result;
          SQL
